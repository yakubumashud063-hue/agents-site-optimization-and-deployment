<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farm Products</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-image: url('/static/images/background.jpg');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            color: #333;
        }

        header {
            background-color: rgba(76, 175, 80, 0.9);
            color: white;
            padding: 1rem 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
        }

        .logo img {
            display: block;
            max-width: 100%;
            height: 50px;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 1rem;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .header-actions button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
        }

        .chat-button, .add-button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 0.5rem;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .save-panel {
            position: absolute;
            top: 90px;
            right: 20px;
            width: 320px;
            max-width: calc(100% - 40px);
            background-color: rgba(255, 255, 255, 0.95);
            color: #152911;
            border-radius: 10px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
            padding: 1rem;
            display: none;
            z-index: 20;
        }

        .message-panel {
            position: absolute;
            top: 90px;
            right: 20px;
            width: 320px;
            max-width: calc(100% - 40px);
            background-color: rgba(255, 255, 255, 0.95);
            color: #152911;
            border-radius: 10px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
            padding: 1rem;
            display: none;
            z-index: 20;
        }

        .save-panel input,
        .save-panel textarea,
        .message-panel textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 0.75rem;
        }

        .panel-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
        }

        .panel-actions button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 0.5rem 0.75rem;
            border-radius: 5px;
            cursor: pointer;
        }

        .panel-actions button:hover {
            background-color: #388E3C;
        }

        .search-bar {
            flex: 1;
            margin-left: 1rem;
            display: flex;
            align-items: center;
        }

        .search-bar input {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .category-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
        }

        .category-item {
            background-color: rgba(232, 232, 232, 0.8);
            padding: 1rem;
            text-align: center;
            border-radius: 5px;
            transition: transform 0.3s;
        }

        .category-item:hover {
            transform: scale(1.05);
        }

        .filter-container {
            margin-bottom: 2rem;
            display: flex;
            justify-content: center;
            gap: 1rem;
        }

        .filter-container select {
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .product-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .product-item {
            background-color: rgba(232, 232, 232, 0.8);
            padding: 1rem;
            text-align: center;
            border-radius: 5px;
            transition: transform 0.3s;
        }

        .product-item:hover {
            transform: scale(1.05);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
        }

        .close-button {
            float: right;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <img src="/static/images/logo.png" alt="FarmFresh Logo">
            </div>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/fruits">Fruits</a></li>
                <li><a href="/delivery_services">Services</a></li>
                <li><a href="/meats">Meats</a></li>
            </ul>
        </nav>
        <div class="header-actions">
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Search...">
            </div>
            <button id="save-button" type="button" onclick="toggleSavePanel()">Save</button>
            <button id="chat-button" class="chat-button" type="button" onclick="toggleMessagePanel()">💬</button>
        </div>
    </header>

    <div id="upload-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>Upload Product</h2>
            <form id="upload-form">
                <input type="text" id="product-name" placeholder="Product Name" required><br>
                <input type="number" id="product-price" placeholder="Price" required><br>
                <input type="file" id="product-image" required><br>
                <button type="submit">Upload</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById("open-modal").addEventListener("click", function() {
            document.getElementById("upload-modal").style.display = "flex";
        });

        document.querySelector(".close-button").addEventListener("click", function() {
            document.getElementById("upload-modal").style.display = "none";
        });
    </script>

    <div class="message-panel" id="message-panel">
        <h3>Chat with FarmFresh</h3>
        <textarea id="chat-text" placeholder="Type your message..."></textarea>
        <div class="panel-actions">
            <button type="button" onclick="sendChat()">Send</button>
            <button type="button" onclick="toggleMessagePanel()">Close</button>
        </div>
    </div>
    <div class="save-panel" id="save-panel">
        <h3>Save a product</h3>
        <input type="text" id="save-product-name" placeholder="Product name">
        <textarea id="save-note" placeholder="Add a note (optional)"></textarea>
        <div class="panel-actions">
            <button type="button" onclick="saveProduct()">Save</button>
            <button type="button" onclick="toggleSavePanel()">Close</button>
        </div>
    </div>
    <script>
        function toggleMessagePanel() {
            const panel = document.getElementById('message-panel');
            const savePanel = document.getElementById('save-panel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
            if (panel.style.display === 'block') savePanel.style.display = 'none';
        }

        function toggleSavePanel() {
            const panel = document.getElementById('save-panel');
            const messagePanel = document.getElementById('message-panel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
            if (panel.style.display === 'block') messagePanel.style.display = 'none';
        }

        function sendChat() {
            const input = document.getElementById('chat-text');
            if (!input.value.trim()) {
                alert('Please type a message first.');
                return;
            }
            alert('Message sent: ' + input.value.trim());
            input.value = '';
            toggleMessagePanel();
        }

        function saveProduct() {
            const nameEl = document.getElementById('save-product-name');
            const noteEl = document.getElementById('save-note');
            const productName = nameEl.value.trim();
            if (!productName) {
                alert('Please enter a product name to save.');
                return;
            }
            const saved = JSON.parse(localStorage.getItem('farmfresh_saved_products') || '[]');
            saved.push({name: productName, note: noteEl.value.trim(), page: location.pathname, savedAt: new Date().toISOString()});
            localStorage.setItem('farmfresh_saved_products', JSON.stringify(saved));
            alert('Saved '"' + productName + '" successfully.');
            nameEl.value = '';
            noteEl.value = '';
            toggleSavePanel();
        }
    </script>

</body>
</html>
